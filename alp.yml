# Endpoint groups for alp and isumeasure. Generated by `isumeasure groups -code webapp/go`; edit freely.
# Order matters: the first matching regex wins, so literal paths (/api/user/me) sit above the parameterized
# siblings (/api/user/[^/]+) that would swallow them. Re-generate when routes are added, or append by hand.
#   alp:        alp ltsv --config alp.yml -r --sort sum --file access.log
#   isumeasure: report / export / the ops panel read this file from the repo root (alp ignores `names`).
matching_groups:
  - "^/assets/[^/]+$"   # static (report 20261029-134509 Unmatched paths)
  - "^/images/[^/]+$"   # static
  - "^/api/app/rides/estimated-fare$"   # POST
  - "^/api/app/nearby-chairs$"   # GET
  - "^/api/app/notification$"   # GET
  - "^/api/app/payment-methods$"   # POST
  - "^/api/app/rides$"   # GET, POST
  - "^/api/app/users$"   # POST
  - "^/api/chair/activity$"   # POST
  - "^/api/chair/chairs$"   # POST
  - "^/api/chair/coordinate$"   # POST
  - "^/api/chair/notification$"   # GET
  - "^/api/internal/matching$"   # GET
  - "^/api/owner/chairs$"   # GET
  - "^/api/owner/owners$"   # POST
  - "^/api/owner/sales$"   # GET
  - "^/api/initialize$"   # POST
  - "^/api/app/rides/[^/]+/evaluation$"   # POST
  - "^/api/chair/rides/[^/]+/status$"   # POST
names:   # isumeasure only: how the group is shown (default: the regex with [^/]+ as :id)
  "^/api/app/rides/[^/]+/evaluation$": "/api/app/rides/:ride_id/evaluation"
  "^/api/chair/rides/[^/]+/status$": "/api/chair/rides/:ride_id/status"
# isumeasure only: the POST that earns score (from the manual's score formula). The panel's Score timeline then
# shows score ÷ its count per run, and report.md prints the count. Use the name as shown in the report.
score_post: "POST /api/app/rides/:ride_id/evaluation"
# isumeasure only: the special prize's score from the manual (first team to reach it). The report shows how close each run is;
# from 75% on, Next step suggests the score-sprint skill (app x2 + measurement off for one bench).
prize_target: 32767
# isumeasure only: this contest's bench messages worth flagging in the report's "Bench output" (regex: meaning).
bench_patterns:
  "想定していない通知": "クリティカル: 通知の内容・順序が違う（通知の状態遷移を壊した）"
  "想定していないライドの状態遷移": "クリティカル: 状態遷移の飛ばし・逆転"
  "完了通知を受け取る前に": "クリティカル: 椅子に前のライドのCOMPLETEDより先に次のライド"
  "長時間マッチング": "クリティカル: マッチングが追いついていない（matcher・internal/matching）"
  "評価がタイムアウト": "クリティカル: POST evaluationが10秒超（決済の待ち）"
  "支払いが行われていない": "クリティカル: 評価済みで未払い"
  "誤った支払い": "クリティカル: 決済の二重請求・金額違い"
  "ユーザー.*増": "ユーザー数の増加（評価が良い）"
  "椅子.*増|椅子.*追加": "椅子の増加"
  "(?i)warning|ワーニング": "ワーニング（200件でFAIL）"

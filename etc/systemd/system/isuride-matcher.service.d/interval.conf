# installed by deploy.sh (section 0, matcher block). The manual lets us change the matcher's spec and interval freely
# (app.md「ライドのマッチング」). 500 ms -> 100 ms, and hit the app directly on 127.0.0.1:8080 instead of going through
# nginx + TLS on the public name (baseline: the real interval on the loaded svc1 was 1,182 ms with a 500 ms sleep).
# env.sh is untouched; ISUCON_MATCHING_INTERVAL is simply no longer used.
[Service]
ExecStart=
ExecStart=/bin/sh -c "while true; do curl -s -o /dev/null http://127.0.0.1:8080/api/internal/matching; sleep 0.1; done"

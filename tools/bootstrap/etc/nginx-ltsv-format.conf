	log_format ltsv "time:$time_local"
		"\tmsec:$msec"
		"\thost:$remote_addr"
		"\tmethod:$request_method"
		"\turi:$request_uri"
		"\tstatus:$status"
		"\treqtime:$request_time"
		"\tapptime:$upstream_response_time"
		"\tsize:$body_bytes_sent"
		"\treqsize:$request_length"
		"\tcookie:$http_cookie"
		"\tauth:$http_authorization"
		"\tua:$http_user_agent"
		"\tconn:$connection"
		"\tconnreq:$connection_requests"
		"\tupstream:$upstream_addr"
		"\tinm:$http_if_none_match"
		"\tuid:$upstream_http_x_isu_uid"
		"\tupconnect:$upstream_connect_time"
		"\tvhost:$host";
